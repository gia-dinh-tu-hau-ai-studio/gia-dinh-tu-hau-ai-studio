name: Deploy Cloud Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-cloud-run-production
  cancel-in-progress: false

env:
  GCP_PROJECT_ID: tu-hau-ai-music
  GCP_REGION: asia-southeast1
  ARTIFACT_REPOSITORY: tu-hau-ai
  API_SERVICE: ai-executor-api
  WEB_SERVICE: ai-executor-web

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: tu-hau-ai-music
          workload_identity_provider: projects/165444056513/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-cloud-run-deployer@tu-hau-ai-music.iam.gserviceaccount.com

      - name: Configure Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet

      - name: Build and push API image
        run: |
          API_IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$API_SERVICE:latest"
          docker build --file infra/docker/api.Dockerfile --tag "$API_IMAGE" .
          docker push "$API_IMAGE"

      - name: Deploy API
        run: |
          gcloud run services update "$API_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$API_SERVICE:latest" \
            --cpu=2 \
            --memory=4Gi \
            --timeout=900 \
            --concurrency=1 \
            --min-instances=1 \
            --max-instances=1 \
            --no-cpu-throttling \
            --quiet

      - name: Build and push web image
        run: |
          WEB_IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$WEB_SERVICE:latest"
          docker build --file infra/docker/web.Dockerfile --tag "$WEB_IMAGE" .
          docker push "$WEB_IMAGE"

      - name: Deploy web
        run: |
          gcloud run services update "$WEB_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$WEB_SERVICE:latest" \
            --quiet

      - name: Report deployed services
        run: |
          gcloud run services describe "$API_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.latestReadyRevisionName,status.url)'
          gcloud run services describe "$WEB_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.latestReadyRevisionName,status.url)'
